<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Quest</title><meta name="description" content="男磨き・恋愛活動・成長コミュニティ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" type="image/png" href="icon-32.png?v=2"><link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="manifest" href="manifest.webmanifest?v=2"><meta name="theme-color" content="#0b1220"><style>:root{font-family:system-ui,sans-serif;color:#e8eefc;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:22px;background:#111e34;border-bottom:1px solid #293b57}h1{margin:0;color:#8fc4ff;font-size:25px}small,.muted{color:#9caec8}main{max-width:850px;margin:auto;padding:18px 18px 90px}.card{background:#17263d;border:1px solid #2d4260;border-radius:15px;padding:18px;margin:13px 0}nav{display:flex;gap:6px;overflow:auto;padding:12px;background:#101b2c;position:sticky;top:0}button{border:0;border-radius:9px;background:#314c70;color:white;padding:11px;cursor:pointer;white-space:nowrap}button.active,.primary{background:#2877cc}input,textarea,select{width:100%;background:#0d192b;color:white;border:1px solid #415b7b;border-radius:8px;padding:12px;margin:8px 0}textarea{min-height:110px}label{display:block;margin-top:12px}progress{width:100%;height:18px;accent-color:#58a6ff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;border-radius:30px;padding:6px 10px;background:#294568;color:#c8e1ff}.hidden{display:none}.item{border-bottom:1px solid #344962;padding:12px 0}a{color:#8fc4ff}#toast{position:fixed;bottom:15px;right:15px;background:#245b46;padding:12px;border-radius:10px;display:none} .brand{display:flex;align-items:center;gap:12px}.brand img{width:56px;height:56px;object-fit:contain;border-radius:50%}.hero{position:relative;margin:0 0 20px;overflow:hidden;border-radius:16px;border:1px solid #365b8d;background:#102f5a}.hero img{display:block;width:100%;height:auto}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;padding:12px;background:#101b2c}.hero-actions button{flex:1}.hero-caption{color:#a8c9ee;font-size:13px;padding:0 12px 12px;background:#101b2c}@media(max-width:550px){header{padding:12px 16px}.brand img{width:44px;height:44px}h1{font-size:21px}main{padding:12px 12px 90px}.hero{border-radius:10px}} </style><header><div class="brand"><img src="assets/aq-logo.png?v=2" alt="AQロゴ"><div><h1>ALPHA QUEST</h1><small>男磨き × 恋愛活動 × 成長コミュニティ</small></div></div></header><nav id="nav"></nav><main id="app"></main><div id="toast"></div><script>
const tabs=[['home','ホーム'],['reflection','振り返り'],['goals','月間目標'],['library','資料室'],['community','コミュニティ'],['profile','ステータス']];const initial={name:'冒険者',role:'一般ユーザー',xp:0,reflections:[],goals:[],posts:[],completed:[],mindset:''};let db;try{db=JSON.parse(localStorage.getItem('aq_v1'))||structuredClone(initial)}catch{db=structuredClone(initial)}let tab='home';const save=()=>{localStorage.setItem('aq_v1',JSON.stringify(db));render();toast('保存しました')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const toast=s=>{let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)};function render(){ $('nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${n}</button>`).join('');const level=Math.floor(db.xp/200)+1;let html='';if(tab==='home')html=`<div class="hero"><img src="assets/aq-adventure.png?v=2" alt="モテ活ドラクエ化計画・冒険の世界"><div class="hero-actions"><button class="primary" onclick="tab='reflection';render()">冒険をはじめる・振り返り</button><button onclick="tab='library';render()">攻略資料を見る</button></div><div class="hero-caption">人生という冒険を、最高の仲間と攻略しよう。</div></div><h2>ようこそ、${esc(db.name)}</h2><div class="card"><span class="pill">Lv.${level} · ${esc(db.role)}</span><h2>${db.xp} XP</h2><progress max="200" value="${db.xp%200}"></progress><p class="muted">次のレベルまで ${200-db.xp%200} XP</p></div><div class="card"><h3>今週のクエスト</h3>${['外見や健康のための行動を1つ実践','相手を尊重した会話を実践','活動を振り返り改善点を記録'].map((q,i)=>`<div class="item"><label><input style="width:auto" type="checkbox" ${db.completed.includes(i)?'checked':''} onchange="quest(${i},this.checked)"> ${q} <small>+20 XP</small></label></div>`).join('')}</div><div class="card"><h3>成長の記録</h3><p>振り返り ${db.reflections.length}件 ／ 月間目標 ${db.goals.length}件 ／ 投稿 ${db.posts.length}件</p></div>`;
if(tab==='reflection')html=`<h2>音声・文章の振り返り</h2><div class="card"><label>活動テーマ</label><select id="kind"><option>恋愛活動</option><option>会話・対人力</option><option>男磨き</option><option>マインドセット</option></select><label>文章で振り返る</label><textarea id="reflection" placeholder="行動・良かったこと・課題・次に試すこと"></textarea><label>音声ファイルを選ぶ（この試作版では端末内での選択のみ）</label><input type="file" id="audio" accept="audio/*"><button class="primary" onclick="addReflection()">振り返りを保存（+30 XP）</button><p class="muted">AI添削・音声アップロード・文字起こしは未接続です。第三者の録音には同意が必要です。</p></div><h3>履歴</h3>${db.reflections.slice().reverse().map(x=>`<div class="card"><small>${esc(x.date)} · ${esc(x.kind)}</small><p style="white-space:pre-wrap">${esc(x.text)}</p></div>`).join('')}`;
if(tab==='goals')html=`<h2>月間目標とマインドセット</h2><div class="card"><label>今月の目標</label><input id="goal" placeholder="例：毎週1回、活動を振り返る"><button class="primary" onclick="addGoal()">目標を追加</button><label>大切にしたい考え方</label><textarea id="mindset" placeholder="どんな自分になりたいか">${esc(db.mindset)}</textarea><button onclick="db.mindset=$('mindset').value;save()">マインドセットを保存</button></div>${db.goals.map((g,i)=>`<div class="card"><label><input style="width:auto" type="checkbox" ${g.done?'checked':''} onchange="db.goals[${i}].done=this.checked;if(this.checked&&!db.goals[${i}].rewarded){db.xp+=40;db.goals[${i}].rewarded=true}save()"> ${esc(g.text)}</label><small>${esc(g.month)}</small></div>`).join('')}`;
const docs={'会話・対人力':['相手の話を深掘りする質問','傾聴と共感の基本'],'男磨き':['清潔感チェックリスト','服装と姿勢の基本'],'恋愛活動':['相手を尊重した誘い方','デート後の振り返り'],'マインド':['失敗を学びに変える方法','月間目標の立て方'],'メンター向け':['添削の基本原則','信頼される指導の仕方']};if(tab==='library')html=`<h2>AQ資料ライブラリ</h2><p class="muted">サンプル教材の一覧です。資料のアップロード・共有機能は今後実装します。</p>${Object.entries(docs).map(([k,v])=>`<div class="card"><h3>📁 ${k}</h3>${v.map(t=>`<div class="item">📄 ${t}</div>`).join('')}</div>`).join('')}`;
if(tab==='community')html=`<h2>コミュニティ</h2><div class="card"><h3>活動報告</h3><textarea id="post" placeholder="学んだこと、質問、仲間に共有したいこと"></textarea><button class="primary" onclick="addPost()">投稿する</button><p class="muted">この試作版では自分の端末にだけ保存されます。ほかの会員には公開されません。</p></div>${db.posts.slice().reverse().map(p=>`<div class="card"><small>${esc(p.date)} · ${esc(db.name)}</small><p style="white-space:pre-wrap">${esc(p.text)}</p></div>`).join('')}`;
if(tab==='profile')html=`<h2>プロフィール・成長ステータス</h2><div class="card"><label>表示名</label><input id="name" value="${esc(db.name)}"><button onclick="db.name=$('name').value.trim()||'冒険者';save()">変更を保存</button><p>役職：${esc(db.role)}（メンター認定は運営審査を想定）</p></div><div class="card"><h3>活動ステータス</h3>${[['行動力',db.completed.length*20],['振り返り力',db.reflections.length*15],['目標達成',db.goals.filter(g=>g.done).length*25],['貢献力',db.posts.length*15]].map(([n,v])=>`<div class="item"><div class="row"><b>${n}</b><span>${Math.min(100,v)}/100</span></div><progress max="100" value="${Math.min(100,v)}"></progress></div>`).join('')}<p class="muted">スコアは試作用の仮ルールです。恋愛の成果や人間的価値を測るものではありません。</p></div>`;
$('app').innerHTML=html}
function quest(i,checked){if(checked&&!db.completed.includes(i)){db.completed.push(i);db.xp+=20}else if(!checked&&db.completed.includes(i)){db.completed=db.completed.filter(x=>x!==i);db.xp=Math.max(0,db.xp-20)}save()}function addReflection(){let t=$('reflection').value.trim();if(!t)return toast('文章を入力してください');db.reflections.push({kind:$('kind').value,text:t,date:new Date().toLocaleDateString('ja-JP')});db.xp+=30;save()}function addGoal(){let t=$('goal').value.trim();if(!t)return toast('目標を入力してください');db.goals.push({text:t,month:new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long'}),done:false,rewarded:false});save()}function addPost(){let t=$('post').value.trim();if(!t)return toast('投稿内容を入力してください');db.posts.push({text:t,date:new Date().toLocaleDateString('ja-JP')});save()}render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn)); }
</script></html>
